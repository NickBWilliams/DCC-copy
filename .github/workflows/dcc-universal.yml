name: DCC Universal independent backend
on:
  push:
    branches:
      - feature/dcc-universal-foundation
    paths:
      - "universal/**"
      - ".github/workflows/dcc-universal.yml"
  pull_request:
    paths:
      - "universal/**"
      - ".github/workflows/dcc-universal.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent API dependencies
        run: python -m pip install -r universal/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q universal
      - name: Test authentication, offers, routing and tenant isolation
        working-directory: universal
        run: python -m pytest -q
      - name: Build portable container
        run: docker build -f universal/Dockerfile universal
