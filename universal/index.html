<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCC Universal · Dispatch Command Center</title>
<style>
:root{font:15px system-ui,sans-serif;background:#0b1220;color:#e5edf9}*{box-sizing:border-box}body{margin:0}header{padding:20px 26px;background:#152137;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:22px;margin:0}small,.muted{color:#a2b2cc}main{max-width:1380px;margin:auto;padding:20px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.panel,.route{border:1px solid #34455e;background:#17243a;border-radius:12px;padding:16px}.metric strong{font-size:29px;display:block;margin-top:8px}.toolbar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,input,select{font:inherit;border-radius:8px;padding:10px;border:1px solid #415777}button{background:#263b58;color:#eef5ff;cursor:pointer}button:hover,.active{background:#2563eb}input,select{background:#0e1a2d;color:#fff}#search{flex:1;min-width:200px}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.routes{display:grid;gap:10px}.route{width:100%;text-align:left;cursor:pointer}.route.selected{border-color:#60a5fa;background:#203858}.line,.row{display:flex;justify-content:space-between;gap:10px}.row{padding:12px 0;border-bottom:1px solid #34455e}.pill{font-size:12px;background:#334155;border-radius:15px;padding:4px 9px}.bar{height:6px;border-radius:6px;background:#34455e;margin-top:12px;overflow:hidden}.bar i{height:100%;background:#34d399;display:block}.notice{padding:12px;background:#214b42;border-radius:8px;margin:15px 0}.danger{background:#7f1d1d}#events{max-height:220px;overflow:auto}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}
</style></head>
<body><header><div><h1>◈ DCC Universal</h1><small>DISPATCH COMMAND CENTER · Independent MVP</small></div><div id="signin"><input id="email" type="email" autocomplete="email" placeholder="Staff email address"><button id="requestLink">Email sign-in link</button><small id="authMessage"></small></div><div id="loggedIn" hidden><small id="identity"></small> <select id="company" aria-label="Company"></select> <button id="signOut">Sign out</button></div></header>
<main id="main" hidden><div class="metrics" id="metrics"></div><div class="toolbar"><input id="search" placeholder="Search routes, contractors, IDs"><button id="create">+ New route</button><button id="refresh">↻ Refresh</button></div><div class="tabs" id="tabs"></div><div class="columns"><section><h2 id="heading">Routes</h2><div id="routes" class="routes"></div></section><aside class="panel"><h2>Route details</h2><div id="details" class="muted">Connect and select a route.</div><h3>Audit history</h3><div id="events"></div></aside></div><div id="notice" role="status"></div></main>
<script>
const stages=['overview','unassigned','ready','flagged','sent','countered','accepted','declined','finalized','completed'];
let routes=[],stage='overview',selected=null;
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const headers=()=>({'Content-Type':'application/json'});
function notice(s){el('notice').innerHTML='<div class="notice">'+esc(s)+'</div>'}
async function request(path,method='GET',body){const r=await fetch(path,{method,headers:headers(),body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request failed');return d}
async function refresh(){try{routes=await request('/api/routes');if(selected&&!routes.some(r=>r.id===selected))selected=null;render();if(selected)await history()}catch(e){notice(e.message)}}
function render(){
const outstanding=routes.filter(r=>r.status!=='completed').reduce((n,r)=>n+r.tasks-r.done,0),backlog=routes.filter(r=>['unassigned','ready','flagged','declined'].includes(r.status)).reduce((n,r)=>n+r.tasks,0),pending=routes.filter(r=>['sent','countered'].includes(r.status)).length,completed=routes.reduce((n,r)=>n+r.done,0);
el('metrics').innerHTML=[['Outstanding tasks',outstanding],['Dispatch backlog',backlog],['Offers awaiting action',pending],['Completed tasks',completed]].map(([l,v])=>'<div class="metric"><small>'+l+'</small><strong>'+v+'</strong></div>').join('');
el('tabs').replaceChildren(...stages.map(s=>{const b=document.createElement('button');b.textContent=s==='overview'?'Overview':s[0].toUpperCase()+s.slice(1)+' ('+routes.filter(r=>r.status===s).length+')';b.className=stage===s?'active':'';b.onclick=()=>{stage=s;render()};return b}));
const q=el('search').value.toLowerCase(),shown=routes.filter(r=>(stage==='overview'||r.status===stage)&&[r.title,r.contractor,r.id].join(' ').toLowerCase().includes(q));el('heading').textContent=(stage==='overview'?'All':stage)+' routes ('+shown.length+')';
el('routes').replaceChildren(...shown.map(r=>{const b=document.createElement('button');b.className='route'+(selected===r.id?' selected':'');b.innerHTML='<div class="line"><strong>'+esc(r.title)+'</strong><span class="pill">'+esc(r.status)+'</span></div><p class="muted">#'+r.id+' · '+esc(r.contractor)+' · '+r.stops+' stops / '+r.tasks+' tasks</p><div class="line"><small>'+r.done+'/'+r.tasks+' completed</small><strong>$'+esc(r.price)+'</strong></div><div class="bar"><i style="width:'+(r.tasks?Math.min(100,100*r.done/r.tasks):0)+'%"></i></div>';b.onclick=()=>{selected=r.id;render();history()};return b}));
const r=routes.find(x=>x.id===selected);el('details').innerHTML=r?'<div class="row"><span>Route</span><b>'+esc(r.title)+'</b></div><div class="row"><span>Contractor</span><b>'+esc(r.contractor)+'</b></div><div class="row"><span>Price</span><b>$'+esc(r.price)+'</b></div><div class="row"><span>Status</span><b>'+esc(r.status)+'</b></div>'+(r.proposed_price?'<div class="row"><span>Counteroffer</span><b>$'+esc(r.proposed_price)+'</b></div>':'')+'<div class="actions" id="actions"></div>':'Select a route to review.';
if(r){const allowed={unassigned:['prepare','flag'],ready:['flag'],flagged:['requeue'],sent:[],countered:['approve_counter','reject_counter'],accepted:['finalize'],finalized:['complete'],declined:['prepare','requeue']};for(const action of allowed[r.status]||[]){const b=document.createElement('button');b.textContent=action.replaceAll('_',' ');b.onclick=()=>act(action);el('actions').append(b)}if(['ready','flagged','sent'].includes(r.status)){const b=document.createElement('button');b.textContent=r.status==='sent'?'Revoke current offer':'Generate contractor offer link';b.onclick=()=>r.status==='sent'?revokeOffer(r):issueOffer(r);el('actions').append(b)}}
}
async function history(){try{const events=await request('/api/routes/'+selected+'/events');el('events').innerHTML=events.map(e=>'<div class="row"><span>'+esc(e.action)+'</span><small>'+esc(e.at.slice(0,16))+'</small></div>').join('')}catch(e){notice(e.message)}}
async function act(action){const r=routes.find(x=>x.id===selected);if(!r)return;let amount=null;if(action==='counter'){const value=prompt('Counteroffer amount ($):');if(value===null)return;amount=Number(value);if(!Number.isFinite(amount)||amount<=0){notice('Enter a valid positive amount');return}}try{await request('/api/routes/'+r.id+'/transition','POST',{action,amount,expected_version:r.version});notice('Route #'+r.id+': '+action+' recorded');await refresh()}catch(e){notice(e.message)}}
async function create(){const title=prompt('Route name / area:');if(!title?.trim())return;const contractor=prompt('Contractor:','Unassigned')||'Unassigned',stops=Number(prompt('Stops:',5)),tasks=Number(prompt('Tasks:',stops)),price=Number(prompt('Proposed price ($):',100));if(![stops,tasks,price].every(Number.isFinite)||stops<0||tasks<0||price<0||!Number.isInteger(stops)||!Number.isInteger(tasks)){notice('Invalid numbers');return}try{const r=await request('/api/routes','POST',{title,contractor,stops,tasks,price});selected=r.id;await refresh();notice('Route created')}catch(e){notice(e.message)}}
async function issueOffer(route){try{const o=await request('/api/routes/'+route.id+'/offers','POST');await refresh();const url=location.origin+o.offer_path;notice('Offer link created. It has NOT been emailed or texted automatically.');try{await navigator.clipboard.writeText(url);notice('Offer link copied. It has NOT been sent automatically.')}catch(e){prompt('Copy this link for the contractor:',url)}}catch(e){notice(e.message)}}
async function revokeOffer(route){if(!confirm('Revoke this offer link? The contractor will no longer be able to respond.'))return;try{await request('/api/routes/'+route.id+'/offers/revoke','POST');notice('Offer revoked');await refresh()}catch(e){notice(e.message)}}
async function session(){try{const u=await request('/api/auth/me');el('signin').hidden=true;el('loggedIn').hidden=false;el('main').hidden=false;el('identity').textContent=u.email+' · '+u.role;el('company').replaceChildren(...u.memberships.map(m=>{const o=document.createElement('option');o.value=m.organization;o.textContent=m.organization;return o}));el('company').value=u.organization;await refresh()}catch(e){el('signin').hidden=false;el('loggedIn').hidden=true;el('main').hidden=true}}
async function start(){const url=new URL(location.href),token=url.searchParams.get('login_token');if(token){url.searchParams.delete('login_token');history.replaceState({},'',url.pathname+url.search+url.hash);try{await request('/api/auth/redeem','POST',{token});el('authMessage').textContent='Signed in'}catch(e){el('authMessage').textContent=e.message}}await session()}
el('requestLink').onclick=async()=>{try{const email=el('email').value;const r=await request('/api/auth/request-link','POST',{email});el('authMessage').textContent=r.message}catch(e){el('authMessage').textContent=e.message}};
el('signOut').onclick=async()=>{try{await request('/api/auth/logout','POST')}catch(e){}await session()};
el('company').onchange=async()=>{try{await request('/api/auth/switch','POST',{organization:el('company').value});selected=null;await session()}catch(e){notice(e.message)}};
el('refresh').onclick=refresh;el('create').onclick=create;el('search').oninput=render;start();
</script></body></html>
