<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCC Universal · Route offer</title><style>body{background:#0e1728;color:#f1f5f9;font:16px system-ui,sans-serif;margin:0;padding:30px 15px}.card{max-width:650px;margin:40px auto;padding:28px;background:#1a2941;border:1px solid #344967;border-radius:16px}h1{font-size:24px}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #526786}button{cursor:pointer;background:#2563eb;color:white;margin:5px}input{background:#0e1728;color:white;max-width:160px}.meta{color:#b8c5d9}#message{padding:12px;margin-top:15px}.stop{padding:12px 0;border-bottom:1px solid #344967}.stop small{color:#b8c5d9;display:block;margin-top:5px}#stops:empty{display:none}</style></head><body><main class="card"><small>DCC UNIVERSAL · CONTRACTOR OFFER</small><h1 id="title">Loading your offer…</h1><p id="details" class="meta"></p><ol id="stops" aria-label="Route itinerary"></ol><div id="controls" hidden><button id="accept">Accept</button><button id="decline">Decline</button><p><label>Counteroffer ($) <input id="amount" type="number" min=".01" step=".01"></label> <button id="counter">Submit counteroffer</button></p></div><p id="message" role="status"></p></main><script>const token=location.pathname.split('/').pop(),base='/api/offers/'+encodeURIComponent(token),e=id=>document.getElementById(id);async function request(url,method='GET',body){const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.detail||'Offer unavailable');return data}async function load(){try{const d=await request(base);e('title').textContent=d.title;e('details').textContent=d.stops+' stops · '+d.tasks+' tasks · $'+d.price+' · Expires '+new Date(d.expires_at).toLocaleString();if(Array.isArray(d.itinerary)){const list=e('stops');list.replaceChildren();for(const stop of d.itinerary){const li=document.createElement('li');li.className='stop';const heading=document.createElement('strong');heading.textContent=stop.venue+' · '+stop.address;li.append(heading);for(const task of stop.tasks||[]){const detail=document.createElement('small');detail.textContent=task.external_task_id+' · '+task.task_type;li.append(detail)}list.append(li)}}e('controls').hidden=false}catch(err){e('title').textContent='Offer unavailable';e('message').textContent=err.message}}async function respond(action){const amount=action==='counter'?Number(e('amount').value):null;if(action==='counter'&&(!Number.isFinite(amount)||amount<=0)){e('message').textContent='Enter a positive amount';return}e('controls').hidden=true;try{const d=await request(base+'/respond','POST',{action,amount});e('message').textContent=d.message+' — '+d.status}catch(err){e('message').textContent=err.message}}e('accept').onclick=()=>respond('accept');e('decline').onclick=()=>respond('decline');e('counter').onclick=()=>respond('counter');load();</script></body></html>
